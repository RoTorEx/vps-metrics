name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make check PYTHON=python
  artifact:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and smoke-test the collector image
        run: |
          make docker-build
          docker run --rm --network none --read-only --cap-drop ALL personal-vps-metrics:2026-10-13 --version
      - run: make build PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: dist/*
  publish:
    needs: artifact
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: dist
      - name: Verify native version and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          (cd dist && sha256sum -c *.sha256)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
  deploy:
    if: vars.METRICS_AUTO_DEPLOY == 'true'
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: production-metrics
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-archive
          path: dist
      - name: Deploy through restricted SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/metrics-ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/metrics-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/metrics-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/metrics-ssh/"*
          export DEPLOY_KEY="$RUNNER_TEMP/metrics-ssh/key"
          export DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/metrics-ssh/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/metrics-ssh"' EXIT
          make deploy PYTHON=python3
